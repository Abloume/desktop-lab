<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>lesson-03 窗口管理</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 1.5rem 2rem; background: #f6f8fa; color: #24292f; }
      h1 { font-size: 1.4rem; margin-top: 0; }
      h3 { margin: 0 0 0.5rem; font-size: 1rem; }
      .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 0.9rem 1.1rem; margin-bottom: 0.9rem; }
      .row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
      input { flex: 1; padding: 5px 8px; border: 1px solid #d0d7de; border-radius: 6px; }
      button { padding: 5px 12px; border-radius: 6px; border: none; cursor: pointer; }
      .primary { background: #1f883d; color: #fff; }
      .secondary { background: #eaeef2; color: #24292f; }
      code { background: #eaeef2; padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
      .output { background: #0d1117; color: #7ee787; border-radius: 6px; padding: 8px 10px; font-size: 0.85rem; min-height: 1.2em; white-space: pre-wrap; }
      .muted { color: #57606a; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <h1>Lesson 03 · 窗口管理</h1>

    <!-- ① 无边框窗口 -->
    <div class="card">
      <h3>① 无边框窗口 + 自定义标题栏拖拽</h3>
      <div class="row"><button id="btn-frameless" class="primary">打开无边框窗口</button></div>
      <p class="muted">
        无边框窗口用 <code>frame: false</code>，标题栏区域靠 CSS <code>-webkit-app-region: drag</code> 拖拽，
        按钮等交互元素必须 <code>no-drag</code>，否则点不到。
      </p>
    </div>

    <!-- ② 父子窗口 -->
    <div class="card">
      <h3>② 父子窗口：parent / modal</h3>
      <div class="row">
        <button id="btn-child" class="secondary">打开子窗口（parent）</button>
        <button id="btn-modal" class="danger">打开模态窗口（modal）</button>
      </div>
      <p class="muted">
        子窗口随父窗口最小化/关闭、永远浮在父之上；模态窗口会<b>锁定父窗口</b>，
        必须先关掉它才能回到父窗口交互。
      </p>
    </div>

    <!-- ③ 多窗口通信 -->
    <div class="card">
      <h3>③ 多窗口通信：主进程转发</h3>
      <div class="row">
        <input id="msg-input" placeholder="输入消息，广播给其他所有窗口（先打开子窗口再试）" />
        <button id="btn-broadcast" class="secondary">广播</button>
      </div>
      <div class="output" id="msg-output">收到的广播消息会显示在这里</div>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
